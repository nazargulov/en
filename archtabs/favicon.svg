<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="aw-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square gradient tile. Anything outside this stays transparent. -->
  <rect x="0" y="0" width="128" height="128" rx="26" ry="26" fill="url(#aw-grad)"/>

  <!-- ArchTabs silhouette: thick inverted-U.
       Outer path then subtract the inner opening via even-odd fill. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 34 102
    L 34 60
    A 30 30 0 0 1 94 60
    L 94 102
    L 80 102
    L 80 60
    A 16 16 0 0 0 48 60
    L 48 102
    Z
  "/>

  <!-- Tab inside the arch opening -->
  <rect x="58" y="74" width="12" height="26" rx="2" fill="#FFFFFF"/>
</svg>
