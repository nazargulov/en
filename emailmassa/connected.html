<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Google Account Connected - EmailMassa</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav shell"><a class="brand" href="index.html"><span class="brand-mark">M</span>EmailMassa</a></nav>
  </header>
  <main class="page-main shell">
    <section class="page-card">
      <div class="eyebrow">Connection complete</div>
      <h1>Your Google account is connected.</h1>
      <p class="lead">EmailMassa is ready for <strong data-account-email>your account</strong>. Return to Gmail and open a compose window to start.</p>
      <div class="status-box success">Authentication succeeded. Premium status will sync automatically for this email address.</div>
      <div class="hero-actions">
        <a class="button" href="https://mail.google.com" target="_blank" rel="noopener">Return to Gmail</a>
        <a class="button secondary" href="welcome.html">View the setup guide</a>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
